# The Ogre 68: a 68-key ergonomic keyboard for ergogen 4.1+.
# `units` below holds the design — column staggers, the thumb fan, the half
# separation. Change the board there; the zones place keys and name legends.
# Below the points: board outline and PCB (custom footprints in footprints/;
# build with `npm run build`, check with `npm run check`, and `npm run snapshot`
# fails on geometry that moved without being meant to).
# Ergogen y points up; KLE/KiCad y points down.
meta:
  engine: 4.1.0
  name: ogre-ergo

units:
  # MX spacing: 19.05 mm pitch, caps 1 mm smaller than the pitch.
  $default_spread: U
  $default_padding: U
  $default_width: U-1
  $default_height: U-1

  # ---- The design ----------------------------------------------------------
  # Every number below shapes the Ogre 68. Change one here, not in the zones,
  # and watch it in `npm run serve`.

  # Column stagger. Each value moves its column against the column before it,
  # so together they draw the profile across the hand. Running total, in U,
  # from the far column: far -0.25, outer -0.25, pinky 0, ring +0.25,
  # middle +0.375, index +0.25, inner +0.125, extra -0.125. The peak is the
  # middle column, the longest finger; the profile falls away on both sides.
  stagger_far: -0.25U      # Esc column, a step below the pinky
  stagger_pinky: 0.25U     # back up from the far and outer columns
  stagger_ring: 0.25U      # ring reaches higher than the pinky
  stagger_middle: 0.125U   # the top of the profile
  stagger_index: -0.125U   # index sits lower than middle
  stagger_inner: -0.125U   # the stretch column, lower again
  stagger_extra: -0.25U    # inner 1u column, lowest of the matrix

  # Thumb cluster: a fan of three columns hung off the bottom of the middle
  # column. The offsets place its near corner, the splay turns the whole fan.
  thumb_offset_x: 23.98
  thumb_offset_y: -10.48
  thumb_splay: -30         # degrees the cluster fans away from the matrix
  thumb_spread: 24.73      # centre to centre, the 1.25u Cmd to the 2.25u Shift
  thumb_stagger_home: 0.875U   # Shift/Alt/Home block, up from Cmd
  thumb_stagger_far: -0.25U    # Alt/Home column, up again from Shift
  thumb_upper_pitch: 1.125U    # Alt to the 1u Home above it

  # Half separation. The mirror axis sits this far right of the extra column,
  # so the gap between the two halves is a result of this number.
  half_spread: 4.25U

  # Outline. The thumb cluster joins the matrix by filling the gaps between
  # keys up to twice this wide; the rest of the edge follows the keycaps.
  thumb_web: 7
  pocket_wall: 1           # board left around each key where a pocket is cut
  pocket_min: 4            # gaps narrower than this stay solid

points:
  zones:
    # `legend` is what's printed on a standard keycap set (not the firmware keymap).
    # `mirror.legend` is the matching key on the right half.
    # Two-part legends are "shifted base", e.g. '! 1'.
    matrix:
      columns:
        far:            # lone key left of the number row
          key.skip: true
          key.stagger: stagger_far
          key.col_net: col6
          rows:
            num: { skip: false, row_net: row3, mirror.row_net: row8, legend: 'Esc', mirror.legend: 'Del' }   # col6 is shared with the extra column, so Esc takes row3
        outer:          # wide caps right-aligned to the pinky column
          key.col_net: col0
          rows:
            mod.skip: true
            bottom: { width: 1.25U-1, adjust.shift: [-0.125U, 0], legend: 'Ctrl',      mirror.legend: 'Ctrl' }
            home:   { width: 1.75U-1, adjust.shift: [-0.375U, 0], legend: 'Caps Lock', mirror.legend: 'Ctrl' }
            top:    { width: 1.5U-1,  adjust.shift: [-0.25U, 0],  legend: 'Tab',       mirror.legend: '| \' }
            num:    { legend: '+ =', mirror.legend: '_ -' }
        pinky:
          key.stagger: stagger_pinky
          key.col_net: col1
          rows:
            mod.skip: true
            bottom: { legend: 'Z',   mirror.legend: '? /' }
            home:   { legend: 'A',   mirror.legend: ': ;' }
            top:    { legend: 'Q',   mirror.legend: 'P' }
            num:    { legend: '! 1', mirror.legend: ') 0' }
        ring:
          key.stagger: stagger_ring
          key.col_net: col2
          rows:
            mod:    { legend: '←',   mirror.legend: '↑' }
            bottom: { legend: 'X',   mirror.legend: '> .' }
            home:   { legend: 'S',   mirror.legend: 'L' }
            top:    { legend: 'W',   mirror.legend: 'O' }
            num:    { legend: '@ 2', mirror.legend: '( 9' }
        middle:
          key.stagger: stagger_middle
          key.col_net: col3
          rows:
            mod:    { legend: '→',   mirror.legend: '↓' }
            bottom: { legend: 'C',   mirror.legend: '< ,' }
            home:   { legend: 'D',   mirror.legend: 'K' }
            top:    { legend: 'E',   mirror.legend: 'I' }
            num:    { legend: '# 3', mirror.legend: '* 8' }
        index:
          key.stagger: stagger_index
          key.col_net: col4
          rows:
            mod.skip: true
            bottom: { legend: 'V',   mirror.legend: 'M' }
            home:   { legend: 'F',   mirror.legend: 'J' }
            top:    { legend: 'R',   mirror.legend: 'U' }
            num:    { legend: '$ 4', mirror.legend: '& 7' }
        inner:
          key.stagger: stagger_inner
          key.col_net: col5
          rows:
            mod.skip: true
            bottom: { legend: 'B',   mirror.legend: 'N' }
            home:   { legend: 'G',   mirror.legend: 'H' }
            top:    { legend: 'T',   mirror.legend: 'Y' }
            num:    { legend: '% 5', mirror.legend: '^ 6' }
        extra:          # inner 1u column (num, top, home only)
          key.stagger: stagger_extra
          key.col_net: col6
          rows:
            mod.skip: true
            bottom.skip: true
            home:   { legend: 'PgDn', mirror.legend: "\" '" }
            top:    { legend: '} ]',  mirror.legend: '{ [' }
            num:    { legend: '~ `',  mirror.legend: 'PgUp' }
      rows:
        mod:    { row_net: row4, mirror.row_net: row9 }
        bottom: { row_net: row3, mirror.row_net: row8 }
        home:   { row_net: row2, mirror.row_net: row7 }
        top:    { row_net: row1, mirror.row_net: row6 }
        num:    { row_net: row0, mirror.row_net: row5 }

    thumb:              # 1.25u, 2.25u, then a 1.25u + 1u stack, fanned 30°
      anchor:
        ref: matrix_middle_mod
        shift: [thumb_offset_x, thumb_offset_y]
        rotate: thumb_splay
      columns:
        near:
          key.width: 1.25U-1
          key.col_net: col4
          rows:
            cluster: { legend: 'Cmd', mirror.legend: 'Fn' }
            upper.skip: true
        home:
          key.spread: thumb_spread
          key.stagger: thumb_stagger_home
          key.width: 2.25U-1
          key.adjust.rotate: 90   # a wide cap turned 90°, so switch and stabilizer footprints face the right way
          key.col_net: col5
          rows:
            cluster: { legend: 'Shift', mirror.legend: 'Enter' }
            upper.skip: true
        far:            # 1.25u Alt with a 1u Home above it
          key.stagger: thumb_stagger_far
          key.col_net: col6
          rows:
            cluster:
              width: 1.25U-1
              adjust.rotate: 90
              padding: thumb_upper_pitch
              legend: 'Alt'
              mirror.legend: 'Alt'
            upper:
              adjust.rotate: 90   # turned 90° like the 1.25u/2.25u thumb caps (mirror flips it to -90)
              col_net: col1       # free matrix spot left by the removed bottom-row keys
              legend: 'Home'
              mirror.legend: 'End'
      rows:
        cluster: { row_net: row4, mirror.row_net: row9 }
        upper:   { row_net: row4, mirror.row_net: row9 }

  mirror:               # halves are symmetric; axis is 2.125U right of the extra column
    ref: matrix_extra_num
    distance: half_spread

# ---------------------------------------------------------------------------
# Board outline. One PCB that builds as a single keyboard, or snaps along two
# break lines into left half, center piece and right half (the Ogre's trick).
# Break-line geometry (cuts, slots, bridges) is measured from each half's
# `extra` column (~ ` key) and mirrored for the right side. The sizes are the
# ones that snapped cleanly on the 2019 board. All numbers are mm, ergogen y up.
# ---------------------------------------------------------------------------
outlines:
  _thumb_keys:          # the thumb cluster and the matrix keys around it, at pitch size
    ones:  { what: rectangle, where: '/matrix_(middle_mod|index_bottom|inner_bottom|extra_home)|thumb_far_upper/', size: [U, U] }
    cmd:   { what: rectangle, where: /thumb_near_cluster/, size: [1.25U, U] }
    shift: { what: rectangle, where: /thumb_home_cluster/, size: [2.25U, U] }
    alt:   { what: rectangle, where: /thumb_far_cluster/,  size: [1.25U, U] }
  _thumb_grown:
    - { what: outline, name: _thumb_keys, expand: thumb_web, joints: round }
  _webs:                # grown then shrunk back: gaps narrower than 2 * thumb_web between keys
                        # fill in, the outer edge falls back onto the keycaps
    - { what: outline, name: _thumb_grown, expand: -thumb_web }
  _thumb_walls:
    - { what: outline, name: _thumb_keys, expand: pocket_wall }
  _gaps:                # web left over once each key keeps a pocket_wall rim, shrunk by pocket_min / 2
    web:   { what: outline, name: _webs }
    walls: { operation: subtract, what: outline, name: _thumb_walls, expand: -pocket_min / 2 }
  _pockets:             # only the biggest gap, over Cmd and under the index/inner columns
    zone:
      what: rectangle
      asym: both
      where: { ref: matrix_inner_bottom, shift: [0.675, -18.3] }
      size: [38.65, 23.4]           # clears the smaller gaps beside it by 1.5 mm or more
    gaps: { operation: intersect, what: outline, name: _gaps, expand: pocket_min / 2 }
                        # grown back, so slivers narrower than pocket_min drop out
  _caps:                # every keycap at its real size, both halves
    ones:   { what: rectangle, where: '-/outer_(top|home|bottom)|thumb_(near|home|far)_cluster/', size: [U, U] }
    tab:    { what: rectangle, where: /outer_top/,          size: [1.5U, U] }
    caps:   { what: rectangle, where: /outer_home/,         size: [1.75U, U] }
    ctrl:   { what: rectangle, where: /outer_bottom/,       size: [1.25U, U] }
    cmd:    { what: rectangle, where: /thumb_near_cluster/, size: [1.25U, U] }
    shift:  { what: rectangle, where: /thumb_home_cluster/, size: [2.25U, U] }
    alt:    { what: rectangle, where: /thumb_far_cluster/,  size: [1.25U, U] }
    webs:   { what: outline, name: _webs }
  _halves:              # keycap edges with 1 mm rounded corners
    - { what: outline, name: _caps, fillet: 1 }   # fillet, like expand, rounds the whole accumulated outline
  board:
    halves: { what: outline, name: _halves }
    pockets:            # the cutout over each Cmd key
      { operation: subtract, what: outline, name: _pockets }
    keepout:            # nothing from the halves inside the center zone, except the thumbs below it
      operation: subtract
      what: rectangle
      asym: both
      where: { ref: matrix_extra_num, shift: [(9.44 + 2.125U) / 2, 0] }
      size: [2.125U - 9.44, 102]    # from the break line to the mirror axis, down to 2 mm below the center piece
    center:             # center piece: holds MCU3 (single-board controller) and its reset switch
      what: rectangle
      where: { ref: matrix_extra_num, shift: [2.125U, -19.69] }   # centered on the mirror axis
      size: [4.25U - 2 * 9.4, 58.62]
    jack_tab:           # raises the top edge over the extra column, where each half's nice!nano has its USB (the 2019 board's TRRS jack sat here)
      what: rectangle
      asym: both
      where: { ref: matrix_extra_num, shift: [1.8375, 0.375U] }   # from 2 mm into the inner column (covers its corner) to x = 15.2
      size: [26.725, 0.75U]
    cut_a:              # break line: slot down beside the jack tab ...
      { operation: subtract, what: rectangle, asym: both, where: { ref: matrix_extra_num, shift: [16.185, 12.66] }, size: [1.97, 24.68] }
    cut_b:              # ... across under the tab ...
      { operation: subtract, what: rectangle, asym: both, where: { ref: matrix_extra_num, shift: [13.305, 1.065] }, size: [7.73, 1.49] }
    cut_c:              # ... and down to the first bridge
      { operation: subtract, what: rectangle, asym: both, where: { ref: matrix_extra_num, shift: [10.47, -6.235] }, size: [2.06, 16.09], corner: 0.5 }
    slot_1:             # routed slots between the four ~2 mm bridges
      { operation: subtract, what: rectangle, asym: both, where: { ref: matrix_extra_num, shift: [10.475, -20.255] }, size: [1.71, 8.05], corner: 0.85 }
    slot_2:
      { operation: subtract, what: rectangle, asym: both, where: { ref: matrix_extra_num, shift: [10.475, -30.44] }, size: [1.71, 8.05], corner: 0.85 }
    slot_3:
      { operation: subtract, what: rectangle, asym: both, where: { ref: matrix_extra_num, shift: [10.475, -40.62] }, size: [1.71, 8.05], corner: 0.85 }
    notch:              # bottom notch up to the last bridge
      { operation: subtract, what: rectangle, asym: both, where: { ref: matrix_extra_num, shift: [10.525, -49.05] }, size: [1.95, 4.9], corner: 0.5 }

# ---------------------------------------------------------------------------
# PCB. 10x7 matrix, COL2ROW diodes, one hotswap switch per key with its diode
# built into the footprint.
# Wireless only: nice!nanos on the back, no TRRS. MCU1/MCU2 (left/right half) and
# MCU3 (center, single-board build) all sit on the same row/column nets; solder
# MCU3 alone, or MCU1 + MCU2. Pad map in footprints/ogre_nicenano.js.
# ---------------------------------------------------------------------------
pcbs:
  ogre:
    template: kicad8
    outlines:
      edge: { outline: board }
    footprints:
      switch:
        what: ogre_hotswap_diode
        where: '-/thumb_home_cluster|extra_(num|top)|^matrix_inner_(num|top)$/'
        params: { from: '{{col_net}}', to: '{{row_net}}', legend: '{{legend}}', cap_w: '{{width}}', cap_h: '{{height}}' }
      switch_mcu:       # ~ and } ] (PgUp and { [ on the right) turned 90°, so their sockets and diodes
                        # stand in a strip up the column and the controller's pad rows pass either side
        what: ogre_hotswap_diode
        where: /^matrix_extra_(num|top)$/
        adjust.rotate: 90
        params: { from: '{{col_net}}', to: '{{row_net}}', legend: '{{legend}}', cap_w: '{{width}}', cap_h: '{{height}}' }

      # Four keys beside a controller keep their diode as a part of its own, so it can
      # be moved clear of traces to the controller's pins: 5 and T next to MCU1, PgUp
      # and { [ under MCU2. Each starts where the built-in diode would be.
      switch_loose:     # 5 and T
        what: ogre_hotswap_diode
        where: /^matrix_inner_(num|top)$/
        params: { from: '{{col_net}}', legend: '{{legend}}', cap_w: '{{width}}', cap_h: '{{height}}', diode: false }
      switch_mcu_loose: # PgUp and { [, turned like ~ and } ]
        what: ogre_hotswap_diode
        where: /^mirror_matrix_extra_(num|top)$/
        adjust.rotate: 90
        params: { from: '{{col_net}}', legend: '{{legend}}', cap_w: '{{width}}', cap_h: '{{height}}', diode: false }
      diode_loose:
        what: ogre_socket_diode
        where: /^matrix_inner_(num|top)$/
        adjust.shift: [8.15, -0.63]
        params: { from: '{{name}}', to: '{{row_net}}' }
      diode_mcu_loose:  # the switch there is turned -90°, so its diode is too
        what: ogre_socket_diode
        where: /^mirror_matrix_extra_(num|top)$/
        adjust: { orient: -90, shift: [8.15, -0.63], resist: true }
        params: { from: '{{name}}', to: '{{row_net}}' }
      switch_2u:        # 2.25U thumb keys get stabilizer holes
        what: ogre_hotswap_diode
        where: /thumb_home_cluster/
        params: { from: '{{col_net}}', to: '{{row_net}}', legend: '{{legend}}', cap_w: '{{width}}', cap_h: '{{height}}', stab: true }

      mcu_left:         # MCU1: up the back of the inner column under ~ and } ], USB flush with the
                        # top of the jack tab; its pad rows clear the turned switches' strip by ~0.9 mm
        what: ogre_nicenano
        where: { ref: matrix_extra_num, shift: [-0.845, 0.375U + 0.375U - 18.3] }
        params: &half_mcu
          side: back
          pad3: GND
          pad4: GND
          pad8: row0
          pad9: row1
          pad10: row2
          pad11: row3
          pad12: row4
          pad14: col6
          pad15: col5
          pad16: col4
          pad17: col3
          pad18: col2
          pad19: col1
          pad20: col0
          pad21: VCC
          pad22: RESET1
          pad23: GND
      mcu_right:        # MCU2: the same under PgUp and { [
        what: ogre_nicenano
        where: { ref: mirror_matrix_extra_num, shift: [-0.845, 0.375U + 0.375U - 18.3] }
        params:
          <<: *half_mcu
          pad8: row5
          pad9: row6
          pad10: row7
          pad11: row8
          pad12: row9
          pad22: RESET2
      mcu_center:       # MCU3: single-board build, all ten rows
        what: ogre_nicenano
        where: { ref: matrix_extra_num, shift: [2.125U, -8.818] }   # USB flush with the top edge
        params:
          side: back
          pad1: row0
          pad2: row1
          pad3: GND
          pad4: GND
          pad5: row2
          pad6: row3
          pad7: row4
          pad8: row5
          pad9: row6
          pad10: row7
          pad11: row8
          pad12: row9
          pad14: col6
          pad15: col5
          pad16: col4
          pad17: col3
          pad18: col2
          pad19: col1
          pad20: col0
          pad21: VCC
          pad22: RESET0
          pad23: GND

      reset_halves:     # SW1/SW2: on the back, below Tab, clear of Tab's diode and Caps Lock's socket
        what: ogre_reset
        asym: both
        where: { ref: matrix_outer_top, shift: [0, -8.5] }
        params: { from: GND, to: RESET1, mirror.to: RESET2 }
      reset_center:     # SW3: below MCU3
        what: ogre_reset
        where: { ref: matrix_extra_num, shift: [2.125U, -34.65] }
        params: { from: GND, to: RESET0 }

# The Ogre 68: a 68-key ergonomic keyboard for ergogen 4.1+.
# `units` below holds the design — column staggers, the thumb fan, the half
# separation. Change the board there; the zones place keys and name legends.
# Below the points: board outline and PCB (custom footprints in footprints/;
# build with `npm run build`, check with `npm run check`, and `npm run snapshot`
# fails on geometry that moved without being meant to).
# Ergogen y points up; KLE/KiCad y points down.
meta:
  engine: 4.1.0
  name: ogre-ergo

units:
  # MX spacing: 19.05 mm pitch, caps 1 mm smaller than the pitch.
  $default_spread: U
  $default_padding: U
  $default_width: U-1
  $default_height: U-1

  # ---- The design ----------------------------------------------------------
  # Every number below shapes the Ogre 68. Change one here, not in the zones,
  # and watch it in `npm run serve`.

  # Column stagger. Each value moves its column against the column before it,
  # so together they draw the profile across the hand. Running total, in U,
  # from the far column: far -0.25, outer -0.25, pinky 0, ring +0.25,
  # middle +0.375, index +0.25, inner +0.125, extra -0.125. The peak is the
  # middle column, the longest finger; the profile falls away on both sides.
  stagger_far: -0.25U      # Esc column, a step below the pinky
  stagger_pinky: 0.25U     # back up from the far and outer columns
  stagger_ring: 0.25U      # ring reaches higher than the pinky
  stagger_middle: 0.125U   # the top of the profile
  stagger_index: -0.125U   # index sits lower than middle
  stagger_inner: -0.125U   # the stretch column, lower again
  stagger_extra: -0.25U    # inner 1u column, lowest of the matrix

  # Thumb cluster: a fan of three columns hung off the bottom of the middle
  # column. The offsets place its near corner, the splay turns the whole fan.
  thumb_offset_x: 23.98
  thumb_offset_y: -10.48
  thumb_splay: -30         # degrees the cluster fans away from the matrix
  thumb_spread: 24.73      # centre to centre, the 1.25u Cmd to the 2.25u Shift
  thumb_stagger_home: 0.875U   # Shift/Alt/Home block, up from Cmd
  thumb_stagger_far: -0.25U    # Alt/Home column, up again from Shift
  thumb_upper_pitch: 1.125U    # Alt to the 1u Home above it

  # Half separation. The mirror axis sits this far right of the extra column,
  # so the gap between the two halves is a result of this number.
  half_spread: 4.25U

  # Controller: the nRF52840 module lies sideways on the back below the extra
  # column's home key (PgDn / " '), where the column has no bottom key, with its
  # antenna end just inside the half's inner edge; the power parts sit in the
  # strips between socket rows in the inner and extra columns. Nothing juts out
  # of the outline for them. `mcu_x` / `mcu_y` are the module's origin from that
  # home key; the origin is 7 mm from its pad end and 11 mm from its antenna end.
  mcu_x: -1.9            # 9.44 (the inner edge) - 0.34 - 11: on the right half the socket of N sits closer, and this clears its pad
  mcu_y: -11.2

  # LED tab: a lip below Esc (Del on the right) for the two 3 mm LEDs, which shine
  # up through a hole in the case just below that key.
  led_tab_w: 10.5
  led_tab_h: 7

  # Outline. The thumb cluster joins the matrix by filling the gaps between
  # keys up to twice this wide; the rest of the edge follows the keycaps.
  thumb_web: 7
  pocket_wall: 1           # board left around each key where a pocket is cut
  pocket_min: 4            # gaps narrower than this stay solid

points:
  zones:
    # `legend` is what's printed on a standard keycap set (not the firmware keymap).
    # `mirror.legend` is the matching key on the right half.
    # Two-part legends are "shifted base", e.g. '! 1'.
    matrix:
      columns:
        far:            # lone key left of the number row
          key.skip: true
          key.stagger: stagger_far
          key.col_net: col6
          rows:
            num: { skip: false, row_net: row3, mirror.row_net: row8, legend: 'Esc', mirror.legend: 'Del' }   # col6 is shared with the extra column, so Esc takes row3
        outer:          # wide caps right-aligned to the pinky column
          key.col_net: col0
          rows:
            mod.skip: true
            bottom: { width: 1.25U-1, adjust.shift: [-0.125U, 0], legend: 'Ctrl',      mirror.legend: 'Ctrl' }
            home:   { width: 1.75U-1, adjust.shift: [-0.375U, 0], legend: 'Caps Lock', mirror.legend: 'Ctrl' }
            top:    { width: 1.5U-1,  adjust.shift: [-0.25U, 0],  legend: 'Tab',       mirror.legend: '| \' }
            num:    { legend: '+ =', mirror.legend: '_ -' }
        pinky:
          key.stagger: stagger_pinky
          key.col_net: col1
          rows:
            mod.skip: true
            bottom: { legend: 'Z',   mirror.legend: '? /' }
            home:   { legend: 'A',   mirror.legend: ': ;' }
            top:    { legend: 'Q',   mirror.legend: 'P' }
            num:    { legend: '! 1', mirror.legend: ') 0' }
        ring:
          key.stagger: stagger_ring
          key.col_net: col2
          rows:
            mod:    { legend: '←',   mirror.legend: '↑' }
            bottom: { legend: 'X',   mirror.legend: '> .' }
            home:   { legend: 'S',   mirror.legend: 'L' }
            top:    { legend: 'W',   mirror.legend: 'O' }
            num:    { legend: '@ 2', mirror.legend: '( 9' }
        middle:
          key.stagger: stagger_middle
          key.col_net: col3
          rows:
            mod:    { legend: '→',   mirror.legend: '↓' }
            bottom: { legend: 'C',   mirror.legend: '< ,' }
            home:   { legend: 'D',   mirror.legend: 'K' }
            top:    { legend: 'E',   mirror.legend: 'I' }
            num:    { legend: '# 3', mirror.legend: '* 8' }
        index:
          key.stagger: stagger_index
          key.col_net: col4
          rows:
            mod.skip: true
            bottom: { legend: 'V',   mirror.legend: 'M' }
            home:   { legend: 'F',   mirror.legend: 'J' }
            top:    { legend: 'R',   mirror.legend: 'U' }
            num:    { legend: '$ 4', mirror.legend: '& 7' }
        inner:
          key.stagger: stagger_inner
          key.col_net: col5
          rows:
            mod.skip: true
            bottom: { legend: 'B',   mirror.legend: 'N', diode: [0, -6, 90], mirror.diode: [0, -6, 90] }   # below the socket: the controller module's pad end is at this key's right edge
            home:   { legend: 'G',   mirror.legend: 'H' }
            top:    { legend: 'T',   mirror.legend: 'Y' }
            num:    { legend: '% 5', mirror.legend: '^ 6' }
        extra:          # inner 1u column (num, top, home only)
          key.stagger: stagger_extra
          key.col_net: col6
          rows:
            mod.skip: true
            bottom.skip: true
            home:   { legend: 'PgDn', mirror.legend: "\" '", diode: [-5.5, 8.1, 90], mirror.diode: [8.15, -0.63, 0] }   # left: lying in the strip past the socket, off the module's antenna and the power switch
            top:    { legend: '} ]',  mirror.legend: '{ [' }
            num:    { legend: '~ `',  mirror.legend: 'PgUp' }
      rows:
        mod:    { row_net: row4, mirror.row_net: row9 }
        bottom: { row_net: row3, mirror.row_net: row8 }
        home:   { row_net: row2, mirror.row_net: row7 }
        top:    { row_net: row1, mirror.row_net: row6 }
        num:    { row_net: row0, mirror.row_net: row5 }

    thumb:              # 1.25u, 2.25u, then a 1.25u + 1u stack, fanned 30°
      anchor:
        ref: matrix_middle_mod
        shift: [thumb_offset_x, thumb_offset_y]
        rotate: thumb_splay
      columns:
        near:
          key.width: 1.25U-1
          key.col_net: col4
          rows:
            cluster: { legend: 'Cmd', mirror.legend: 'Fn' }
            upper.skip: true
        home:
          key.spread: thumb_spread
          key.stagger: thumb_stagger_home
          key.width: 2.25U-1
          key.adjust.rotate: 90   # a wide cap turned 90°, so switch and stabilizer footprints face the right way
          key.stab: true          # 2.25U: stabilizer holes
          key.col_net: col5
          rows:
            cluster: { legend: 'Shift', mirror.legend: 'Enter' }
            upper.skip: true
        far:            # 1.25u Alt with a 1u Home above it
          key.stagger: thumb_stagger_far
          key.col_net: col6
          rows:
            cluster:
              width: 1.25U-1
              adjust.rotate: 90
              padding: thumb_upper_pitch
              legend: 'Alt'
              mirror.legend: 'Alt'
            upper:
              adjust.rotate: 90   # turned 90° like the 1.25u/2.25u thumb caps (mirror flips it to -90)
              col_net: col1       # free matrix spot left by the removed bottom-row keys
              legend: 'Home'
              mirror.legend: 'End'
      rows:
        cluster: { row_net: row4, mirror.row_net: row9 }
        upper:   { row_net: row4, mirror.row_net: row9 }

  mirror:               # halves are symmetric; axis is 2.125U right of the extra column
    ref: matrix_extra_num
    distance: half_spread

# ---------------------------------------------------------------------------
# Board outline: two halves, always split, each its own PCB (`left`, `right`).
# `board` is both together, for viewing. All numbers are mm, ergogen y up.
# ---------------------------------------------------------------------------
outlines:
  _thumb_keys:          # the thumb cluster and the matrix keys around it, at pitch size
    ones:  { what: rectangle, where: '/matrix_(middle_mod|index_bottom|inner_bottom|extra_home)|thumb_far_upper/', size: [U, U] }
    cmd:   { what: rectangle, where: /thumb_near_cluster/, size: [1.25U, U] }
    shift: { what: rectangle, where: /thumb_home_cluster/, size: [2.25U, U] }
    alt:   { what: rectangle, where: /thumb_far_cluster/,  size: [1.25U, U] }
  _thumb_grown:
    - { what: outline, name: _thumb_keys, expand: thumb_web, joints: round }
  _webs:                # grown then shrunk back: gaps narrower than 2 * thumb_web between keys
                        # fill in, the outer edge falls back onto the keycaps
    - { what: outline, name: _thumb_grown, expand: -thumb_web }
  _thumb_walls:
    - { what: outline, name: _thumb_keys, expand: pocket_wall }
  _gaps:                # web left over once each key keeps a pocket_wall rim, shrunk by pocket_min / 2
    web:   { what: outline, name: _webs }
    walls: { operation: subtract, what: outline, name: _thumb_walls, expand: -pocket_min / 2 }
  _pockets:             # only the biggest gap, over Cmd and under the index/inner columns
    zone:
      what: rectangle
      asym: both
      where: { ref: matrix_inner_bottom, shift: [0.675, -18.3] }
      size: [38.65, 23.4]           # clears the smaller gaps beside it by 1.5 mm or more
    gaps: { operation: intersect, what: outline, name: _gaps, expand: pocket_min / 2 }
                        # grown back, so slivers narrower than pocket_min drop out
  _caps:                # every keycap at its real size, both halves
    ones:   { what: rectangle, where: '-/outer_(top|home|bottom)|thumb_(near|home|far)_cluster/', size: [U, U] }
    tab:    { what: rectangle, where: /outer_top/,          size: [1.5U, U] }
    caps:   { what: rectangle, where: /outer_home/,         size: [1.75U, U] }
    ctrl:   { what: rectangle, where: /outer_bottom/,       size: [1.25U, U] }
    cmd:    { what: rectangle, where: /thumb_near_cluster/, size: [1.25U, U] }
    shift:  { what: rectangle, where: /thumb_home_cluster/, size: [2.25U, U] }
    alt:    { what: rectangle, where: /thumb_far_cluster/,  size: [1.25U, U] }
    webs:   { what: outline, name: _webs }
  _halves:              # keycap edges with 1 mm rounded corners
    - { what: outline, name: _caps, fillet: 1 }   # fillet, like expand, rounds the whole accumulated outline
  board:
    halves: { what: outline, name: _halves }
    pockets:            # the cutout over each Cmd key
      { operation: subtract, what: outline, name: _pockets }
    inner_edge:         # each half stops just inside its inner column's edge, above the thumbs;
                        # the controller module's antenna end sits on this edge
      operation: subtract
      what: rectangle
      asym: both
      where: { ref: matrix_extra_num, shift: [(9.44 + 2.125U) / 2, 0] }
      size: [2.125U - 9.44, 102]    # to the mirror axis, down to just above the thumb cluster
    led_tab:            # below Esc / Del, hanging off the cap's bottom edge, left of Tab / | \
      what: rectangle
      asym: both
      where: { ref: matrix_far_num, shift: [-0.5U + led_tab_w / 2 - 0.5, -0.5U + 1 - led_tab_h / 2] }
      size: [led_tab_w, led_tab_h]
  left:                 # the left half's PCB outline: everything left of the mirror axis
    - { what: outline, name: board }
    - { operation: intersect, what: rectangle, where: { ref: matrix_extra_num, shift: [2.125U - 250, 0] }, size: [500, 500] }
  right:
    - { what: outline, name: board }
    - { operation: intersect, what: rectangle, where: { ref: matrix_extra_num, shift: [2.125U + 250, 0] }, size: [500, 500] }

# ---------------------------------------------------------------------------
# PCB: two boards, always split, wireless only: `left` and `right`, each a half
# with its own nRF52840 module and power section on the back, all surface mount
# for JLCPCB assembly (footprints from JLC's library, each with its LCSC number).
# 10x7 matrix, COL2ROW diodes, one hotswap socket and one diode per key. Rows 0-4
# are the left half, 5-9 the right; columns 0-6 on both. Pin map in
# footprints/ogre_e73.js.
# Power, as on the nice!nano v2: the battery (JST PH, + BAT) through a slide
# switch (VBAT) into a BQ24075 charger/power path, whose OUT (VDDH) feeds the
# module in high-voltage mode and an XC6220 LDO (VCC, cut off by P0.13) for
# anything else. USB comes over a 4-pin cable from a Unified Daughterboard S1
# in the case. Two hand-soldered 3 mm LEDs on the front below Esc / Del: status
# (P0.15) and charge (the charger's CHG).
# Each board numbers its own parts in key order: MX1-MX34, S1-S34 and D1-D34.
# Everything else hides under the keys on the back: the module below the extra
# column's home key (see units), the rest in the strips between socket rows,
# each placed from a nearby key and moved in KiCad.
# ---------------------------------------------------------------------------
pcbs:
  left:
    template: kicad8
    params:
      origin: [38.78015, 145.53875]   # where build.js moves the board on KiCad's page (mm, y down), as placed in KiCad
    outlines:
      edge: { outline: left }
    footprints:
      switch: &switch   # one per key: holes, cap outline, legend; a key's `stab` adds stabilizer holes, its `turn` turns the switch
        what: ogre_hotswap
        where: '-/^mirror_/'
        params: { legend: '{{legend}}', cap_w: '{{width}}', cap_h: '{{height}}', stab: '{{stab}}', turn: '{{turn}}' }

      socket: &socket   # the hotswap socket on the back of each switch, over its pins
        what: ogre_socket
        where: '-/^mirror_/'
        params: { from: '{{col_net}}', to: '{{name}}', turn: '{{turn}}' }

      # One diode per key, a part of its own so it can be moved clear of traces: at
      # the key's `diode` ([x, y, r] from the key; see the zones) or, without one, at
      # the switch's right edge, where the 2024 footprint drew it built in.
      diode: &diode
        what: ogre_socket_diode
        where: '-/^mirror_/'
        params: { from: '{{name}}', to: '{{row_net}}', place: '{{diode}}' }

      # ---- Controller and power, on the back under the keys. The right half reuses
      # each `where` from the mirrored key, and the footprints turn the other way,
      # so the module's antenna still points at the inner edge.
      mcu:              # MCU1: sideways below PgDn, antenna end on the inner edge
        what: ogre_e73
        where: &w_mcu { ref: matrix_extra_home, shift: [mcu_x, mcu_y], rotate: 90 }
        params: &mcu
          side: back
          col_0: col0
          col_1: col1
          col_2: col2
          col_3: col3
          col_4: col4
          col_5: col5
          col_6: col6
          row_1: row0
          row_2: row1
          row_3: row2
          row_4: row3
          row_5: row4
      # between G's socket and B: the module's supply, next to its pad end, and the crystal
      mcu_l:            # L1: DCCH -> VDD, the module's own 3.3 V
        what: ogre_l0805
        where: &w_mcu_l { ref: matrix_inner_home, shift: [-7.2, -4.5] }
        params: &mcu_l { side: back, value: 10uH, lcsc: C1046, from: DCCH, to: VDD }
      mcu_c1:           # C1: VDD
        what: ogre_c0603
        where: &w_mcu_c1 { ref: matrix_inner_home, shift: [-3.9, -4.5] }
        params: &c_4u7_vdd { side: back, value: 4.7uF, lcsc: C19666, from: VDD, to: GND }
      mcu_c2:           # C2: VDD
        what: ogre_c0603
        where: &w_mcu_c2 { ref: matrix_inner_home, shift: [-0.9, -4.5] }
        params: &c_100n_vdd { side: back, value: 100nF, lcsc: C14663, from: VDD, to: GND }
      mcu_c3:           # C3: VDDH at the module
        what: ogre_c0603
        where: &w_mcu_c3 { ref: matrix_inner_home, shift: [2.1, -4.5] }
        params: &c_4u7_vddh { side: back, value: 4.7uF, lcsc: C19666, from: VDDH, to: GND }
      mcu_c4:           # C4: VBUS at the module
        what: ogre_c0603
        where: &w_mcu_c4 { ref: matrix_inner_home, shift: [5.1, -4.5] }
        params: &c_4u7_vbus { side: back, value: 4.7uF, lcsc: C19666, from: VBUS, to: GND }
      xtal:             # Y1: 32.768 kHz
        what: ogre_crystal
        where: &w_xtal { ref: matrix_inner_home, shift: [-6.5, -9] }
        params: &xtal { side: back }
      xtal_c1:          # C5, C6: its load caps
        what: ogre_c0603
        where: &w_xtal_c1 { ref: matrix_inner_home, shift: [-2.9, -9] }
        params: &c_xl1 { side: back, value: 12pF, lcsc: C38523, from: XL1, to: GND }
      xtal_c2:
        what: ogre_c0603
        where: &w_xtal_c2 { ref: matrix_inner_home, shift: [0.1, -9] }
        params: &c_xl2 { side: back, value: 12pF, lcsc: C38523, from: XL2, to: GND }
      led_r_status:     # R4: P0.15 -> status LED
        what: ogre_r0603
        where: &w_led_r_status { ref: matrix_inner_home, shift: [3.1, -9] }
        params: &r_status { side: back, value: 1k, lcsc: C21190, from: BLED, to: LED_S }
      led_r_charge:     # R5: VDDH -> charge LED -> CHG
        what: ogre_r0603
        where: &w_led_r_charge { ref: matrix_inner_home, shift: [5.9, -9] }
        params: &r_charge { side: back, value: 1k, lcsc: C21190, from: VDDH, to: LED_C }
      # between } ]'s socket and PgDn: the charger and the LDO, with the power switch on the inner edge
      charger:          # IC1: BQ24075
        what: ogre_bq24075
        where: &w_charger { ref: matrix_extra_home, shift: [-9, 11.2] }
        params: &charger { side: back }
      charger_c_in:     # C7: VBUS at IN
        what: ogre_c0603
        where: &w_charger_c_in { ref: matrix_extra_home, shift: [-5.7, 11.2], rotate: 90 }
        params: &c_1u_vbus { side: back, value: 1uF, lcsc: C1592, from: VBUS, to: GND }
      charger_c_out:    # C8: VDDH at OUT
        what: ogre_c0603
        where: &w_charger_c_out { ref: matrix_extra_home, shift: [-3.5, 11.2], rotate: 90 }
        params: *c_4u7_vddh
      charger_c_bat:    # C9: VBAT
        what: ogre_c0603
        where: &w_charger_c_bat { ref: matrix_extra_home, shift: [-1.3, 11.2], rotate: 90 }
        params: &c_4u7_vbat { side: back, value: 4.7uF, lcsc: C19666, from: VBAT, to: GND }
      charger_r_ts:     # R1: fakes the battery thermistor
        what: ogre_r0603
        where: &w_charger_r_ts { ref: matrix_extra_home, shift: [0.9, 11.2], rotate: 90 }
        params: &r_ts { side: back, value: 10k, lcsc: C25804, from: TS, to: GND }
      charger_r_iset:   # R2: charge current, K / 10k ≈ 100 mA
        what: ogre_r0603
        where: &w_charger_r_iset { ref: matrix_extra_home, shift: [3.1, 11.2], rotate: 90 }
        params: &r_iset { side: back, value: 10k, lcsc: C25804, from: ISET, to: GND }
      ldo:              # IC2: XC6220, VCC for anything besides the module
        what: ogre_xc6220
        where: &w_ldo { ref: matrix_extra_home, shift: [-0.5, 14.5] }
        params: &ldo { side: back }
      ldo_c_in:         # C10
        what: ogre_c0603
        where: &w_ldo_c_in { ref: matrix_extra_home, shift: [-9.5, 14.5] }
        params: &c_10u_vddh { side: back, value: 10uF, lcsc: C19702, from: VDDH, to: GND }
      ldo_c_out:        # C11
        what: ogre_c0603
        where: &w_ldo_c_out { ref: matrix_extra_home, shift: [-6.9, 14.5] }
        params: &c_4u7_vcc { side: back, value: 4.7uF, lcsc: C19666, from: VCC, to: GND }
      ldo_r_ce:         # R3: CE pulled up, so VCC is on unless P0.13 says otherwise
        what: ogre_r0603
        where: &w_ldo_r_ce { ref: matrix_extra_home, shift: [-4.3, 14.5] }
        params: &r_ce { side: back, value: 10M, lcsc: C7250, from: VDDH, to: PWR_EN }
      usb:              # J1: the daughterboard cable, on the inner edge beside the LDO, opening toward
                        # the edge so the cable leaves the board toward the middle
        what: ogre_usb
        where: &w_usb { ref: matrix_extra_home, shift: [9.44 - 0.6 - 2.48, 11.9] }
        params: &usb { side: back }
      # between ~ `'s socket and } ]: the battery plug, on the inner edge, opening toward it
      battery:          # J2: + on pad 1, the Adafruit/SparkFun convention
        what: ogre_battery
        where: &w_battery { ref: matrix_extra_top, shift: [9.44 - 1 - 4.37, 11.5], rotate: 90 }   # its mounting pads reach 0.26 past the courtyard
        params: &battery { side: back, plus: 1 }
      # between T's socket and G: the programming pads, between T's side pins
      swd:              # J3
        what: ogre_swd
        where: &w_swd { ref: matrix_inner_home, shift: [0, 12.5] }
        params: &swd { side: back }
      # between % 5's socket and T: reset, between % 5's side pins
      reset:            # SW1
        what: ogre_reset
        where: &w_reset { ref: matrix_inner_top, shift: [0, 12] }
        params: &reset { side: back, from: GND, to: RESET }
      power:            # SW2: on the bottom edge below Z, body 0.6 mm in, lever out past it;
                        # BAT in on the common, VBAT out when on
        what: ogre_power_switch
        where: &w_power { ref: matrix_pinky_bottom, shift: [0, -0.5U + 0.6 + 1.4] }
        params: &power { common: BAT, on: VBAT, side: back }

      led_status:       # LED1, LED2: on the front, on the tab below Esc; cathode (flat) at each origin,
                        # anode toward Tab (turned round on the right half, where the tab mirrors)
        what: ogre_led
        where: { ref: matrix_far_num, shift: [-8.6, -0.5U - 3.3] }
        params: &led_status { anode: LED_S, cathode: GND, value: STATUS, color: blue }
      led_charge:
        what: ogre_led
        where: { ref: matrix_far_num, shift: [-2.7, -0.5U - 3.3] }
